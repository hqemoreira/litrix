<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){try{var t=(localStorage.getItem("morea-theme")||localStorage.getItem("litrix-theme"));if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<title>Comprehension check | Morea Evidence Pack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header">
  <div class="container-wide">
    <a class="wordmark" href="/">
      <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true" fill="none"><path d="M16.2 2.8c-2.8 2.4-7.6 5.8-9.4 11.2-1.4 4.2.2 8.6 3.8 11.2 1.6 1.1 3.4 1.8 5.4 1.8 1.6 0 3.2-.5 4.8-1.4 3.8-2.2 6.2-6.2 5.6-10.8C25.6 9.2 21.2 5.2 16.2 2.8z" fill="currentColor"/><path d="M15.6 7.2v9.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity="0.35"/><path class="logo-check" d="M12.2 17.6l3.2 3.2 5.2-5.6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="wordmark-text">Morea<span class="article4">Evidence Pack</span></span>
    </a>
    <nav class="site-nav">
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle theme"></button>
    </nav>
  </div>
</header>

<main class="container app-shell">
  <div id="morea-stepper" class="morea-stepper-host no-print" data-step="quiz"></div>
  <p class="step-where">Step 04 · Quiz</p>
  <h1 id="quiz-title">Three quick questions</h1>
  <p class="step-what">Confirm understanding for your track. Explanations appear after you submit.</p>
  <p class="step-next">Next: Optional policy draft</p>
  <form id="quiz-form" class="dossier"></form>
  <section id="result" class="dossier" style="display:none; margin-top:24px;"></section>
  <div id="morea-flow-nav" data-back="/module.html" data-form="quiz-form" data-continue-label="Submit answers"></div>
</main>

<footer class="site-footer">
  <div class="container-wide site-footer-bar">
    <a class="footer-mark" href="/"><svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true" fill="none"><path d="M16.2 2.8c-2.8 2.4-7.6 5.8-9.4 11.2-1.4 4.2.2 8.6 3.8 11.2 1.6 1.1 3.4 1.8 5.4 1.8 1.6 0 3.2-.5 4.8-1.4 3.8-2.2 6.2-6.2 5.6-10.8C25.6 9.2 21.2 5.2 16.2 2.8z" fill="currentColor"/><path d="M15.6 7.2v9.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity="0.35"/><path class="logo-check" d="M12.2 17.6l3.2 3.2 5.2-5.6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Morea</a>
    <p class="footer-status">Personal reskilling project · Non-commercial · Not a product for sale · No accounts / no billing</p>
    <nav class="footer-links">
      <a href="/terms.html">Terms</a>
      <a href="/privacy.html">Privacy</a>
    </nav>
  </div>
</footer>

<script src="/js/theme.js"></script>
<script src="/js/storage.js"></script>
<script src="/js/stepper.js"></script>
<script src="/js/flow-nav.js"></script>
<script src="/js/quiz.js"></script>
<script>
const intake = MoreaStore.getJSON("intake");
if (!intake) {
  window.location.href = "/inventory.html";
}

const track = intake.track || MoreaStore.trackFromRole(intake.answers && intake.answers.role);
const QUIZ = moreaQuizForTrack(track);
document.getElementById("quiz-title").textContent =
  track === "partner_ops"
    ? "Partner / ops — three questions"
    : "Staff user — three questions";

const form = document.getElementById("quiz-form");

QUIZ.forEach((q, qi) => {
  const fieldset = document.createElement("fieldset");
  const legend = document.createElement("legend");
  legend.textContent = "Question " + (qi + 1) + " of " + QUIZ.length;
  fieldset.appendChild(legend);

  const label = document.createElement("h3");
  label.textContent = q.question;
  fieldset.appendChild(label);

  q.options.forEach((opt) => {
    const row = document.createElement("label");
    row.className = "option-row";
    const input = document.createElement("input");
    input.type = "radio";
    input.name = q.id;
    input.value = opt.value;
    input.required = true;
    row.appendChild(input);
    row.appendChild(document.createTextNode(opt.label));
    fieldset.appendChild(row);
  });

  form.appendChild(fieldset);
});

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const data = new FormData(form);
  let correctCount = 0;
  let explainHtml = "";

  QUIZ.forEach((q, i) => {
    const chosen = data.get(q.id);
    const correctOpt = q.options.find((o) => o.correct);
    const ok = chosen === correctOpt.value;
    if (ok) correctCount++;
    explainHtml +=
      '<div class="quiz-explain' + (ok ? "" : " is-wrong") + '">' +
      "<strong>Q" + (i + 1) + (ok ? " — correct.</strong> " : " — not quite.</strong> ") +
      (q.explain || "") +
      "</div>";
  });

  const quizResult = {
    score: correctCount,
    total: QUIZ.length,
    passed: correctCount === QUIZ.length,
    track: track,
    completedAt: new Date().toISOString()
  };
  MoreaStore.setJSON("quiz", quizResult);

  const resultEl = document.getElementById("result");
  resultEl.style.display = "block";

  if (quizResult.passed) {
    resultEl.innerHTML =
      '<p class="dossier-label">Result</p><h2>' + correctCount + " / " + QUIZ.length + " correct</h2>" +
      explainHtml +
      '<p style="margin-top:16px;">Comprehension confirmed. Next: optional policy draft, then your Evidence Pack.</p>' +
      '<a class="btn btn-primary" href="/policy.html">Continue to policy draft</a>';
  } else {
    resultEl.innerHTML =
      '<p class="dossier-label">Result</p><h2>' + correctCount + " / " + QUIZ.length + " correct</h2>" +
      explainHtml +
      '<div class="notice notice-error" style="margin-top:14px;">Review the notes above, then try again so this counts as demonstrated comprehension.</div>' +
      '<button class="btn btn-secondary" onclick="window.location.reload()">Try again</button>';
  }
  resultEl.scrollIntoView({ behavior: "smooth" });
});
</script>
</body>
</html>
